name: Build thesis PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Rename output
        run: mv main.pdf thesis.pdf

      - name: Upload artifact (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis.pdf

      - name: Publish to pdf-preview branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Materialise an orphan pdf-preview branch that carries only the PDF.
          # Force-pushing on each build keeps the branch small and the URL stable.
          mkdir /tmp/pdf-preview
          mv thesis.pdf /tmp/pdf-preview/thesis.pdf

          git checkout --orphan pdf-preview
          git rm -rf . > /dev/null
          mv /tmp/pdf-preview/thesis.pdf thesis.pdf

          cat > README.md <<'EOF'
          # thesis.pdf (auto-built)

          This branch is regenerated by GitHub Actions on every push to `main`.
          It holds nothing but the latest compiled PDF.

          Stable link:
          https://github.com/ErikGraeter/Masters-Thesis/raw/pdf-preview/thesis.pdf
          EOF

          git add thesis.pdf README.md
          git commit -m "Auto-build thesis.pdf from ${GITHUB_SHA::7}"
          git push --force origin pdf-preview
